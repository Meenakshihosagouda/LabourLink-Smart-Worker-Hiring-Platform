{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Contractor Profile | LABOURLINK{% endblock %}

{% block extra_css %}
<style>
    .edit-hero {
        background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
        color: white;
        padding: 40px 24px;
        border-radius: 0 0 32px 32px;
        margin-bottom: 30px;
    }

    .form-card {
        background: white;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        border: 1px solid #f1f5f9;
        max-width: 600px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #475569;
    }

    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        font-size: 15px;
    }

    .btn-save {
        width: 100%;
        padding: 14px;
        background: #3A3E6C;
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s;
        margin-top: 10px;
    }

    .btn-save:hover {
        transform: translateY(-2px);
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-hero">
    <div class="main-container" style="max-width: 600px; margin: 0 auto;">
        <h1 style="margin:0; font-size:28px;">Company Profile</h1>
        <p style="margin:8px 0 0 0; opacity:0.8;">Update your fleet information and business details.</p>
    </div>
</div>

<div class="main-container">
    <div class="form-card">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Company/Agency Name</label>
                <input type="text" name="company_name" value="{{ contractor.company_name }}" required>
            </div>

            <div class="form-group">
                <label>Contact Phone</label>
                <input type="text" name="phone" value="{{ contractor.phone }}" required>
            </div>

            <div class="form-group">
                <label>Primary Operational Area</label>
                <input type="text" name="area" value="{{ contractor.area }}" required>
            </div>

            <button type="submit" class="btn-save">Update Business Profile</button>
            <a href="{% url 'contractor_dashboard' %}"
                style="display:block; text-align:center; margin-top:15px; color:#64748b; text-decoration:none; font-size:14px;">Cancel
                & Return</a>
        </form>
    </div>
</div>
{% endblock %}
